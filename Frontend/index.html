<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Itla Gym · Gestión del gimnasio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <span class="marca-sello" aria-hidden="true">F</span>
        <div>
          <strong>Itla Gym</strong>
          <small>Gestión del gimnasio</small>
        </div>
      </div>
      <nav id="nav" aria-label="Secciones"></nav>
      <div class="lateral-pie">
        <span class="punto" id="punto-api"></span>
        <span id="estado-api">Conectando…</span>
      </div>
    </aside>

    <main class="contenido">
      <header class="cabecera">
        <div>
          <h1 id="titulo"></h1>
          <p id="subtitulo"></p>
        </div>
        <div id="acciones"></div>
      </header>
      <section id="vista" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="dlg-form"></dialog>
  <dialog id="dlg-borrar"></dialog>
  <div id="avisos" role="status"></div>

 
  <script src="js/api.js"></script>
  <script src="js/entidades/clientes.js"></script>
  <script src="js/entidades/membresias.js"></script>
  <script src="js/entidades/entrenadores.js"></script>
  <script src="js/entidades/pagos.js"></script>
  <script src="js/entidades/rutinas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
